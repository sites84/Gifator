<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gifator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  :root { --primary: #6366f1; --bg: #f8fafc; --card: #ffffff; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #1e293b; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  
  .container { width: 100%; max-width: 850px; }
  header { margin-bottom: 30px; text-align: center; }
  
  .upload-section { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
  #drop-zone { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 15px; min-height: 140px; margin-top: 20px; }
  
  .thumb { width: 130px; height: 130px; border-radius: 10px; cursor: move; overflow: hidden; border: 2px solid #e2e8f0; background: white; display: flex; align-items: center; justify-content: center; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  .control-group { display: flex; flex-direction: column; gap: 8px; }
  
  input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  .btn-main { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
  .btn-main:hover { opacity: 0.9; }

  .affiliate-section { background: #fffbeb; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-top: 30px; text-align: center; }
  .affiliate-section a { color: #d97706; font-weight: bold; text-decoration: none; }

  #modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
  #modal img { max-width: 100%; max-height: 70vh; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); object-fit: contain; margin-bottom: 20px; }

  #offer-popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
  #offer-popup .popup-content { background: #ffffff; padding: 15px; border-radius: 20px; max-width: 450px; width: 100%; position: relative; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Gifator</h1>
    <p>Arraste as miniaturas para reordenar sua animação</p>
  </header>

  <!-- Banner Customizado -->
  <a href="https://simule.mycon.com.br/?referralcode=P8tKvjN4vR%2fXk9dn%2bXx41A%3d%3d" target="_blank" rel="noopener noreferrer" style="display: block; width: 100%; margin: 20px 0; text-align: center;">
    <img src="https://i.postimg.cc/13V8TY9h/schema-banner.jpg" style="max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);" alt="Banner de Ofertas">
  </a>

  <div class="upload-section">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div id="drop-zone"></div>
  </div>

  <div class="controls-grid">
    <div class="control-group">
      <label>Nome do Arquivo</label>
      <input type="text" id="fileName" value="meu_gif">
    </div>
    <div class="control-group">
      <label>Velocidade (ms)</label>
      <input type="number" id="delayInput" value="150" min="50">
    </div>
    <div class="control-group" style="justify-content:flex-end">
      <label><input type="checkbox" id="fillMode"> Preencher (Crop)</label>
    </div>
    <button class="btn-main" id="btn">Gerar GIF Agora</button>
  </div>

  <div id="status" style="margin-top:20px; text-align:center"></div>
  <div id="progress-container" style="width:100%; height:8px; background:#e2e8f0; margin-top:10px; border-radius:4px">
    <div id="progress-bar" style="height: 100%; background: var(--primary); width: 0%; border-radius: 4px;"></div>
  </div>
  
  <div id="result-wrapper" style="margin-top:30px; text-align:center"></div>

  <div class="affiliate-section">
    <h4>Ferramentas recomendadas:</h4>
    <p>Crie artes: <a href="#" target="_blank">Canva Pro</a> | Otimize seu site: <a href="#" target="_blank">Hostinger</a>.</p>
  </div>
</div>

<div id="modal">
  <img id="modal-img">
  <a id="modal-download" class="btn-main" style="background:#22c55e">⬇️ Baixar GIF</a>
  <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:15px; background:transparent; border:none; color:#94a3b8; cursor:pointer">Fechar Visualização</button>
</div>

<div id="offer-popup">
  <div class="popup-content">
    <button id="close-btn" style="position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 20px; font-weight: bold;">×</button>
    <img src="https://i.postimg.cc/Mpq08SFq/image-3b32cd6c.png" style="width: 100%; border-radius: 12px; margin-bottom: 15px; display: block;">
    <a href="https://s.shopee.com.br/AKa7kV28Ow" target="_blank" rel="noopener noreferrer" style="display: block; background: #22c55e; color: white; padding: 16px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 18px; text-transform: uppercase;">Acessar Ofertas</a>
  </div>
</div>

<script>
(function() {
    const popup = document.getElementById('offer-popup');
    const closeBtn = document.getElementById('close-btn');
    setTimeout(() => { popup.style.display = 'flex'; }, 1000);
    const closeAction = () => { popup.remove(); };
    closeBtn.addEventListener('click', closeAction);
    popup.addEventListener('click', (e) => { if (e.target === popup) closeAction(); });
})();

const workerUrl = URL.createObjectURL(new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');`], {type: 'application/javascript'}));
const dropZone = document.getElementById('drop-zone');
new Sortable(dropZone, { animation: 150 });

document.getElementById('fileInput').onchange = (e) => {
  dropZone.innerHTML = '';
  Array.from(e.target.files).slice(0, 10).forEach(file => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${url}">`;
    div.onclick = () => showModal(url);
    dropZone.appendChild(div);
  });
};

document.getElementById('btn').onclick = async () => {
  const thumbs = document.querySelectorAll('.thumb img');
  if(thumbs.length < 2) return alert("Selecione pelo menos 2 fotos.");
  const progressBar = document.getElementById('progress-bar');
  const fill = document.getElementById('fillMode').checked;
  const imgElements = await Promise.all(Array.from(thumbs).map(img => new Promise(r => {
    const i = new Image();
    i.onload = () => r(i);
    i.src = img.src;
  })));
  const maxWidth = Math.max(...imgElements.map(i => i.width));
  const maxHeight = Math.max(...imgElements.map(i => i.height));
  const gif = new GIF({ workers: 2, quality: 1, width: maxWidth, height: maxHeight, workerScript: workerUrl });
  imgElements.forEach(img => {
    const canvas = document.createElement('canvas');
    canvas.width = maxWidth; canvas.height = maxHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, maxWidth, maxHeight);
    if(fill) {
      const scale = Math.max(maxWidth / img.width, maxHeight / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (maxWidth-w)/2, (maxHeight-h)/2, w, h);
    } else {
      ctx.drawImage(img, (maxWidth-img.width)/2, (maxHeight-img.height)/2);
    }
    gif.addFrame(ctx, {delay: parseInt(document.getElementById('delayInput').value), copy: true});
  });
  gif.on('progress', p => progressBar.style.width = (p * 100) + '%');
  gif.on('finished', blob => {
    const url = URL.createObjectURL(blob);
    document.getElementById('result-wrapper').innerHTML = `<p>GIF Gerado!</p><img src="${url}" style="width:150px; cursor:pointer; border-radius:8px; border:2px solid #6366f1" onclick="showModal('${url}')">`;
  });
  gif.render();
};

function showModal(url) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-img').src = url;
  document.getElementById('modal-download').href = url;
  document.getElementById('modal-download').download = document.getElementById('fileName').value + '.gif';
}
</script>
</body>
</html>
